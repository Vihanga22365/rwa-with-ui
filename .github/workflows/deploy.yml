name: Build & Deploy to Contabo

# Build the images on GitHub's runners (plenty of RAM), push them to GitHub
# Container Registry, then SSH into the VPS and pull + restart. The VPS never
# builds anything itself.

on:
  push:
    branches: [master]
  workflow_dispatch: {}

# Don't let two deploys run at once; let an in-flight deploy finish.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # allow pushing images to GHCR
    outputs:
      backend_image: ${{ steps.names.outputs.backend_image }}
      frontend_image: ${{ steps.names.outputs.frontend_image }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image names
        id: names
        run: |
          REPO="${GITHUB_REPOSITORY,,}"   # GHCR requires lowercase names
          echo "backend_image=ghcr.io/${REPO}-backend"  >> "$GITHUB_OUTPUT"
          echo "frontend_image=ghcr.io/${REPO}-frontend" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./Backend
          push: true
          tags: |
            ${{ steps.names.outputs.backend_image }}:latest
            ${{ steps.names.outputs.backend_image }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./Frontend
          push: true
          tags: |
            ${{ steps.names.outputs.frontend_image }}:latest
            ${{ steps.names.outputs.frontend_image }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BACKEND_IMAGE: ${{ needs.build.outputs.backend_image }}:${{ github.sha }}
          FRONTEND_IMAGE: ${{ needs.build.outputs.frontend_image }}:${{ github.sha }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          envs: GHCR_USER,GHCR_TOKEN,BACKEND_IMAGE,FRONTEND_IMAGE
          script: |
            set -euo pipefail
            cd ~/rwa

            # Authenticate to GHCR (token is valid for the duration of this run).
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            # Pin the exact image tags into .env so every later `docker compose`
            # command (and reboots) uses the same release. Secrets stay intact.
            touch .env
            sed -i '/^BACKEND_IMAGE=/d;/^FRONTEND_IMAGE=/d' .env
            printf 'BACKEND_IMAGE=%s\nFRONTEND_IMAGE=%s\n' "$BACKEND_IMAGE" "$FRONTEND_IMAGE" >> .env

            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
            docker compose ps
