# Frontend nginx: serves the Angular SPA and proxies /api/* to the backend
# container on the internal Docker network. Single public entry point (port 80).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Allow reasonably large email bodies to be posted to the agent.
    client_max_body_size 16m;

    # gzip for the static bundle
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Public health passthrough for uptime monitoring (backend's /health route).
    location = /health {
        proxy_pass http://backend:8000/health;
        access_log off;
    }

    # API -> backend service (Docker DNS name "backend", see docker-compose.yml).
    # The /api/ prefix is preserved, so FastAPI receives /api/rwa/... unchanged.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # LLM multi-agent calls are slow; give them room before timing out.
        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # Cache fingerprinted static assets aggressively (outputHashing = all).
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: every other route returns index.html (client-side routing).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
